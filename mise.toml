# --------------------------------------------------
# mise development environment and task configuration.
#
# mise owns tool versions, environment bootstrapping, and the stable developer
# interface. pnpm owns the underlying repository scripts.
# --------------------------------------------------

min_version = "2026.9.18"
monorepo_root = true

# Discover opted-in project tasks without enrolling independent submodules
[monorepo]
config_roots = ["projects/example", "projects/packages/*"]
lockfile = false

[settings]
aqua.registries = [".mise/aqua.yaml"]
lockfile = true
locked = true

[tools]
node = "24.15.0"
"npm:pnpm" = "10.20.0"
"npm:@devcontainers/cli" = "0.88.0"
pipx = "1.17.6"
uv = "0.12.10"
shellcheck = "0.11.0"
trivy = "0.69.3"
act = "0.2.89"
actionlint = "1.7.7"
conftest = "0.69.0"
minisign = "0.12"
gitleaks = "8.30.1"
gum = "2.0.0"
hadolint = "2.15.1"
tombi = "1.5.2"
yamllint = { version = "1.38.0", uvx = true }
zizmor = "1.26.1"

[tasks.install]
description = "Install repository dependencies"
run = "pnpm install --frozen-lockfile --ignore-scripts --silent"

[tasks."schemas:update"]
description = "Refresh local schema bundles for the pinned sources and tools"
run = "pnpm run schemas:update"

[tasks."schemas:check"]
description = "Verify committed schema bytes and tool-version alignment offline"
run = "pnpm run schemas:check"

[tasks."licenses:update"]
description = "Refresh owner-scoped tool and dependency license notices"
run = "pnpm run licenses:update"

[tasks."licenses:check"]
description = "Verify license input hashes and collected notices offline"
run = "pnpm run licenses:check"

[tasks.setup]
description = "Set up the repository"
depends = ["install"]
run = "bash scripts/linux/commands/repository/setup.sh"

[tasks.init]
description = "Initialize the repository after the development container starts"
run = "bash scripts/linux/commands/devcontainer/init.sh"

[tasks.doctor]
description = "Diagnose and repair safe repository-local setup"
run = "bash scripts/linux/commands/repository/doctor.sh"

[tasks.health]
description = "Validate repository readiness without repairing setup"
run = "bash scripts/linux/commands/repository/health.sh"

[tasks.commit]
description = "Create a commit with the interactive Commitizen prompt"
run = "pnpm run commit"

[tasks.format]
description = "Format organization setup and projects using their own rules"
run = "pnpm run format"

[tasks.lint]
description = "Lint the shell and ordinary projects with shared tools and local overrides"
run = "pnpm run lint"

[tasks."lint:commit"]
description = "Lint the latest commit message"
run = "pnpm run lint:commit"

[tasks.test]
description = "Test the organization development setup"
run = "pnpm run test"

[tasks."test:devcontainer"]
description = "Build and smoke-test a disposable development container"
run = "pnpm run test:devcontainer"

[tasks.build]
description = "Build the organization development setup"
run = "pnpm run build"

[tasks.audit]
description = "Audit repository and project dependencies"
run = "pnpm run audit"

[tasks.check]
description = "Run organization development setup quality gates"
run = "pnpm run check"

# Project scripts own application behavior while Turbo schedules their tasks
[tasks."projects:build"]
description = "Build ordinary projects in dependency order"
run = "pnpm run projects:build"

[tasks."projects:check"]
description = "Run ordinary projects' declared check scripts"
run = "pnpm run projects:check"

[tasks."projects:dev"]
description = "Start ordinary projects' declared development servers"
run = "pnpm run projects:dev"

[tasks."projects:test"]
description = "Test ordinary projects after dependency builds"
run = "pnpm run projects:test"

[tasks."devcontainer:up"]
description = "Create or start the development container"
run = "pnpm run devcontainer:up"

[tasks."devcontainer:rebuild"]
description = "Rebuild the development container without cached image layers"
run = "pnpm run devcontainer:rebuild"

[tasks."devcontainer:clear"]
description = "Remove this workspace's development container caches"
run = "pnpm run devcontainer:clear"

[tasks."devcontainer:recover"]
description = "Preview or restart the existing container without resetting volumes"
run = "pnpm run devcontainer:recover"

[tasks."devcontainer:update"]
description = "Update and lock Dev Container dependencies"
run = "pnpm run devcontainer:update"

[tasks."devcontainer:shell"]
description = "Open Bash inside the development container"
run = "pnpm run devcontainer:shell"

[tasks."devcontainer:doctor"]
description = "Repair safe repository-local setup inside the development container"
run = "pnpm run devcontainer:doctor"

[tasks."devcontainer:health"]
description = "Validate readiness inside the development container"
run = "pnpm run devcontainer:health"

[tasks."devcontainer:scan"]
description = "Build and scan the development-container image and generate its SBOM"
run = "pnpm run devcontainer:scan"

[tasks."lint:secrets"]
description = "Scan complete Git history for secrets"
run = "pnpm run lint:secrets"

[tasks."lint:secrets:staged"]
description = "Scan staged changes for secrets"
run = "pnpm run lint:secrets:staged"

[tasks."lint:dockerfile"]
description = "Lint the development-container Dockerfile"
run = "pnpm run lint:dockerfile"

[tasks."lint:policy"]
description = "Validate repository configuration policy"
run = "pnpm run lint:policy"

[tasks."lint:toml"]
description = "Lint repository TOML configuration"
run = "pnpm run lint:toml"

[tasks."lint:yaml"]
description = "Lint repository YAML configuration"
run = "pnpm run lint:yaml"
