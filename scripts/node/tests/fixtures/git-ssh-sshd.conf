# Only disposable fixture keys and accounts are used by this server.
Port 22
HostKey /fixture/host_key
AuthorizedKeysFile /fixture/authorized_keys
# The fixture is read-only but may have a different host UID than git-test.
StrictModes no
PasswordAuthentication yes
KbdInteractiveAuthentication no
UsePAM no
PermitRootLogin no
AllowUsers git-test
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PidFile /run/sshd.pid
LogLevel ERROR
